<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Runner — Screenshot 5 Tema Background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #eee; font-family: 'Segoe UI', sans-serif; padding: 20px; }
  h1 { text-align: center; margin-bottom: 10px; color: #64c8ff; }
  .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
  .controls { text-align: center; margin-bottom: 30px; }
  .controls button {
    background: #1a1a2e; color: #64c8ff; border: 1px solid #64c8ff;
    padding: 10px 24px; margin: 4px; border-radius: 8px;
    cursor: pointer; font-size: 14px; transition: 0.2s;
  }
  .controls button:hover { background: #64c8ff; color: #111; }
  .controls button.active { background: #64c8ff; color: #111; font-weight: bold; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 20px; }
  .theme-card {
    background: #1a1a2e; border-radius: 12px; overflow: hidden;
    border: 1px solid #333; transition: 0.2s;
  }
  .theme-card:hover { border-color: #64c8ff; transform: translateY(-2px); }
  .theme-card canvas { width: 100%; display: block; }
  .theme-info { padding: 15px; }
  .theme-info h3 { font-size: 18px; margin-bottom: 4px; }
  .theme-info .desc { color: #888; font-size: 13px; }
  .theme-info .badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 11px; margin-top: 6px;
  }
  .badge-dark { background: #0f0f1a; color: #8ad4ff; }
  .badge-light { background: #eefaf0; color: #1a5a2e; }
  .status { text-align: center; margin-top: 20px; color: #888; font-size: 13px; }
  #screenshotBtn { background: #ff6b35; color: #fff; border: none; font-size: 16px; padding: 12px 32px; }
  #screenshotBtn:hover { background: #e05220; }
</style>
</head>
<body>

<h1>🎨 Voice Runner — 5 Tema Background</h1>
<p class="subtitle">Tool untuk screenshot otomatis tiap tema. Klik "Ambil Screenshot" untuk download semua tema.</p>

<div class="controls">
  <button onclick="switchTheme(0)" class="active" id="btn0">🌆 City</button>
  <button onclick="switchTheme(1)" id="btn1">🌲 Forest</button>
  <button onclick="switchTheme(2)" id="btn2">🌙 Night</button>
  <button onclick="switchTheme(3)" id="btn3">🌅 Morning</button>
  <button onclick="switchTheme(4)" id="btn4">🌇 Sore</button>
  <button onclick="captureAll()" id="screenshotBtn">📸 Ambil Screenshot Semua</button>
</div>

<div class="gallery" id="gallery"></div>
<div class="status" id="status">Memuat game engine...</div>

<script>
// ===== Konfigurasi 5 tema =====
const THEMES = [
  { name: 'City', emoji: '🌆', distance: 100, desc: 'Siang urban — langit biru, gedung tinggi, awan tipis', isDark: false },
  { name: 'Forest', emoji: '🌲', distance: 900, desc: 'Hutan — langit hijau pastel, pohon segitiga, bukit landai', isDark: false },
  { name: 'Night', emoji: '🌙', distance: 1700, desc: 'Malam — langit navy gelap, bintang, bulan, gunung siluet', isDark: true },
  { name: 'Morning', emoji: '🌅', distance: 2500, desc: 'Pagi — langit pastel oranye-pink, matahari terbit', isDark: false },
  { name: 'Sore', emoji: '🌇', distance: 3300, desc: 'Sunset — langit oranye-ungu, matahari tenggelam', isDark: false }
];

let canvases = [];
let currentTheme = 0;
let gameInitialized = false;

// ===== Fungsi render tema langsung pakai Canvas 2D =====
// (tanpa perlu load game.js — render murni canvas)
function renderTheme(themeIdx, canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = 500;
  const h = canvas.height = 350;
  const gy = h * 0.78; // groundY
  const distance = THEMES[themeIdx].distance;
  const frameCount = 0;

  // Pilih palette tema
  let palette;
  switch(themeIdx) {
    case 0: // City
      palette = {
        sky: ['#5ec8ff', '#b8e6ff', '#f4fbff'],
        stars: 0, clouds: true,
        sun: { alpha: 0.85, size: 30, y: 0.16, clip: false },
        moon: { alpha: 0 },
        mountains: 0, mountainsColor: '#cfe8f8',
        buildings: 0.2, buildingColor: '#3d6ea6',
        trees: 0, glow: { color: '130, 200, 255', strength: 0.05 }
      };
      break;
    case 1: // Forest
      palette = {
        sky: ['#8fdcae', '#c2efcf', '#eefaf0'],
        stars: 0, clouds: true,
        sun: { alpha: 0.55, size: 34, y: 0.2, clip: false },
        moon: { alpha: 0 },
        mountains: 0.06, mountainsColor: '#4d8f6a',
        buildings: 0, buildingColor: '#2e6b4a',
        trees: 0.25, glow: { color: '100, 210, 140', strength: 0.05 }
      };
      break;
    case 2: // Night
      palette = {
        sky: ['#0f0f1a', '#1a1a2e', '#0a0a0a'],
        stars: 1, clouds: false,
        sun: { alpha: 0 },
        moon: { alpha: 0.9, size: 24, y: 0.16 },
        mountains: 0.08, mountainsColor: '#ffffff',
        buildings: 0.06, buildingColor: '#ffffff',
        trees: 0, glow: { color: '100, 200, 255', strength: 0.08 }
      };
      break;
    case 3: // Morning
      palette = {
        sky: ['#ffd9a8', '#ffeecb', '#a9d8ff'],
        stars: 0.1, clouds: true,
        sun: { alpha: 0.95, size: 50, y: 0.34, clip: true },
        moon: { alpha: 0 },
        mountains: 0.06, mountainsColor: '#c9a0b0',
        buildings: 0.05, buildingColor: '#8a6a7a',
        trees: 0, glow: { color: '255, 190, 120', strength: 0.08 }
      };
      break;
    case 4: // Sore
      palette = {
        sky: ['#ff9a4d', '#e77ba8', '#6a4a9f'],
        stars: 0.2, clouds: false,
        sun: { alpha: 0.9, size: 42, y: 0.46, clip: true },
        moon: { alpha: 0 },
        mountains: 0.08, mountainsColor: '#3a2a5a',
        buildings: 0.14, buildingColor: '#2a1a3a',
        trees: 0, glow: { color: '255, 130, 90', strength: 0.08 }
      };
      break;
  }

  // === SKY GRADIENT ===
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  for (let i = 0; i < 3; i++) {
    grad.addColorStop(i / 2, palette.sky[i]);
  }
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // === STARS ===
  if (palette.stars > 0) {
    for (let i = 0; i < 80; i++) {
      const sx = (i * 23 + 7) % w;
      const sy = (i * 17 + 11) % (h * 0.5);
      const sz = 0.5 + (i % 3) * 0.5;
      const twinkle = 0.7 + Math.sin(i * 1.3 + frameCount * 0.02) * 0.3;
      ctx.globalAlpha = palette.stars * 0.5 * twinkle;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(sx, sy, sz, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // === CLOUDS ===
  if (palette.clouds) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < 4; i++) {
      const cx = (i * 200 + 30 - distance * 0.02) % (w + 200) - 100;
      const cy = 40 + (i % 3) * 40;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 50, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + 28, cy - 7, 36, 10, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // === SUN ===
  if (palette.sun && palette.sun.alpha > 0) {
    const s = palette.sun;
    let sx = w * 0.72;
    let sy = h * s.y;
    if (s.clip) {
      sy = gy - s.size * 0.35;
    }
    ctx.save();
    ctx.globalAlpha = s.alpha;
    if (s.clip) {
      ctx.beginPath();
      ctx.rect(0, 0, w, gy);
      ctx.clip();
    }
    const halo = ctx.createRadialGradient(sx, sy, 4, sx, sy, s.size * 2.2);
    halo.addColorStop(0, 'rgba(255,245,210,0.4)');
    halo.addColorStop(1, 'rgba(255,245,210,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(sx - s.size * 2.2, sy - s.size * 2.2, s.size * 4.4, s.size * 4.4);
    ctx.fillStyle = '#fff6d8';
    ctx.beginPath();
    ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // === MOON ===
  if (palette.moon && palette.moon.alpha > 0) {
    const m = palette.moon;
    const mx = w * 0.78;
    const my = h * m.y;
    ctx.save();
    ctx.globalAlpha = m.alpha;
    ctx.fillStyle = '#f5f7ff';
    ctx.shadowColor = 'rgba(230,235,255,0.4)';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(mx, my, m.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(200,210,235,0.35)';
    ctx.beginPath(); ctx.arc(mx - 7, my - 4, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 6, my + 5, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 1, my + 9, 2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // === MOUNTAINS ===
  if (palette.mountains > 0) {
    ctx.save();
    ctx.globalAlpha = palette.mountains;
    ctx.fillStyle = palette.mountainsColor;
    for (let i = 0; i < 6; i++) {
      const mx = (i * 200 + 50 - distance * 0.04) % (w + 200) - 100;
      const mh = 50 + (i * 23) % 100;
      const mw = 160 + (i * 17) % 120;
      ctx.beginPath();
      ctx.moveTo(mx, gy);
      ctx.lineTo(mx + mw / 2, gy - mh);
      ctx.lineTo(mx + mw, gy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // === BUILDINGS ===
  if (palette.buildings > 0) {
    ctx.save();
    ctx.globalAlpha = palette.buildings;
    ctx.fillStyle = palette.buildingColor;
    for (let i = 0; i < 12; i++) {
      const bx = (i * (w / 12) + 40 - distance * 0.08) % (w + 150) - 75;
      const bh = 40 + Math.sin(i * 2.5) * 25 + (i % 4) * 10;
      const bw = 28 + Math.sin(i * 1.7) * 12;
      ctx.fillRect(bx, gy - bh, bw, bh);
      // Windows
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      for (let wy = 8; wy < bh - 10; wy += 12) {
        ctx.fillRect(bx + 4, gy - bh + wy, 4, 5);
      }
      ctx.fillStyle = palette.buildingColor;
    }
    ctx.restore();
  }

  // === TREES (Forest) ===
  if (palette.trees > 0) {
    ctx.save();
    ctx.globalAlpha = palette.trees;
    for (let i = 0; i < 10; i++) {
      const tx = (i * (w / 10) + 30 - distance * 0.08) % (w + 150) - 75;
      const tht = 60 + Math.sin(i * 2.1) * 18 + (i % 3) * 8;
      const tw = 22 + Math.sin(i * 1.3) * 6;
      ctx.fillStyle = '#5a3d22';
      ctx.fillRect(tx - 2, gy - tht * 0.35, 5, tht * 0.35);
      ctx.fillStyle = '#2e6b4a';
      ctx.beginPath();
      ctx.moveTo(tx - tw, gy - tht * 0.45);
      ctx.lineTo(tx, gy - tht);
      ctx.lineTo(tx + tw, gy - tht * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(tx - tw * 0.65, gy - tht * 0.2);
      ctx.lineTo(tx, gy - tht * 0.5);
      ctx.lineTo(tx + tw * 0.65, gy - tht * 0.2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // === GROUND LINE ===
  ctx.save();
  const groundGlow = ctx.createLinearGradient(0, gy - 3, 0, gy + 3);
  groundGlow.addColorStop(0, 'rgba(255,255,255,0)');
  groundGlow.addColorStop(0.5, 'rgba(255,255,255,0.3)');
  groundGlow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = groundGlow;
  ctx.fillRect(0, gy - 3, w, 6);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, gy);
  ctx.lineTo(w, gy);
  ctx.stroke();
  ctx.restore();

  // === AMBIENT GLOW ===
  ctx.save();
  const glowPulse = 0.3 + Math.sin(frameCount * 0.02) * 0.15;
  const ambientGrad = ctx.createRadialGradient(
    w * 0.5, gy + 50, 10,
    w * 0.5, gy + 50, h * 0.5
  );
  ambientGrad.addColorStop(0, `rgba(${palette.glow.color}, ${glowPulse * palette.glow.strength})`);
  ambientGrad.addColorStop(0.5, `rgba(${palette.glow.color}, ${glowPulse * palette.glow.strength * 0.5})`);
  ambientGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = ambientGrad;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  // === TEXT OVERLAY ===
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0, 0, w, 32);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(THEMES[themeIdx].emoji + ' ' + THEMES[themeIdx].name + ' — ' + Math.floor(distance) + 'm', w / 2, 22);
  ctx.restore();
}

// ===== Build gallery =====
function buildGallery() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  THEMES.forEach((theme, i) => {
    const card = document.createElement('div');
    card.className = 'theme-card';
    card.id = 'card-' + i;
    const canvas = document.createElement('canvas');
    canvas.id = 'canvas-' + i;
    canvas.width = 500;
    canvas.height = 350;
    canvases[i] = canvas;
    renderTheme(i, canvas);

    const info = document.createElement('div');
    info.className = 'theme-info';
    info.innerHTML = `
      <h3>${theme.emoji} ${theme.name} <span class="badge ${theme.isDark ? 'badge-dark' : 'badge-light'}">${theme.isDark ? '🌙 Gelap' : '☀️ Terang'}</span></h3>
      <p class="desc">${theme.desc}</p>
      <p class="desc" style="margin-top:4px;font-size:11px;">📍 Jarak: ~${theme.distance}m</p>
    `;
    card.appendChild(canvas);
    card.appendChild(info);
    gallery.appendChild(card);
  });
  document.getElementById('status').textContent = '✅ 5 tema siap! Klik tombol screenshot untuk download.';
}

// ===== Switch theme highlight =====
function switchTheme(idx) {
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn' + idx);
  if (btn) btn.classList.add('active');
  currentTheme = idx;
  const card = document.getElementById('card-' + idx);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ===== Capture all themes as images =====
async function captureAll() {
  const btn = document.getElementById('screenshotBtn');
  btn.textContent = '⏳ Mengambil screenshot...';
  btn.disabled = true;

  for (let i = 0; i < THEMES.length; i++) {
    const canvas = canvases[i];
    // Render ulang dengan jarak presisi
    renderTheme(i, canvas);
    
    // Download
    const link = document.createElement('a');
    link.download = `theme-${THEMES[i].name.toLowerCase()}-${THEMES[i].distance}m.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    await new Promise(r => setTimeout(r, 300));
  }

  btn.textContent = '✅ Selesai! ' + THEMES.length + ' screenshot terdownload';
  setTimeout(() => {
    btn.textContent = '📸 Ambil Screenshot Semua';
    btn.disabled = false;
  }, 2000);
}

// ===== Init =====
buildGallery();
</script>
</body>
</html>
