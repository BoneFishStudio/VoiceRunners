# 📦 Build Itch.io ZIP + GitHub Release
# Deploy web TIDAK lewat CI/CD — Vercel native Git Integration yang handle
# (connect repo di dashboard Vercel → auto-deploy ke voicerunners.vercel.app).
#
# Workflow ini hanya untuk:
#   1. Build ZIP siap-upload Itch.io (index.html + js/ + css/ + Music/ + assets/ + manifest.json + sw.js)
#   2. Buat Git tag + GitHub Release berisi ZIP tsb di SETIAP push ke main/master
# Build desktop (.exe/.dmg/.AppImage) di-handle terpisah oleh electron-build.yml
# dan di-upload ke release yang SAMA (tag versi formatnya identik).

name: 📦 Build Itch.io ZIP + Release

on:
  push:
    branches: [main, master]
  # Trigger manual dari GitHub UI kalau perlu
  workflow_dispatch:

jobs:
  release:
    name: 📦 ZIP + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Diperlukan untuk push tag + buat release
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧪 Check JavaScript syntax
        run: |
          for file in js/*.js; do
            echo "Checking $file..."
            node --check "$file" 2>&1 || {
              echo "❌ Syntax error in $file"
              exit 1
            }
          done
          echo "✅ All JavaScript files have valid syntax"

      - name: 🏷️ Generate version
        id: version
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: 🏷️ Buat Git Tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Tag idempotent: skip kalau sudah ada (misal dipakai electron-build lebih dulu)
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "⚠️ Tag $VERSION sudah ada — skip"
          else
            git tag $VERSION
            git push origin $VERSION
            echo "✅ Tag created: $VERSION"
          fi

      - name: 📦 Build ZIP (Itch.io ready)
        run: |
          # Buat ZIP langsung di workspace root
          ZIP_NAME="VoiceRunner-${{ steps.version.outputs.version }}.zip"
          zip -r "$ZIP_NAME" index.html js/ css/ Music/ assets/ manifest.json sw.js vercel.json
          echo "=== ✅ Build Artifact ==="
          ls -lh "$ZIP_NAME"
          echo "Total size:"
          du -sh "$ZIP_NAME"
          echo "========================"

      - name: 📦 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Voice Runner ${{ steps.version.outputs.version }}"
          files: |
            VoiceRunner-*.zip
          body: |
            ## 🚀 Voice Runner ${{ steps.version.outputs.version }}

            **Commit:** ${{ github.event.head_commit.message || 'Manual trigger' }}

            **🌐 Play Online:** [voicerunners.vercel.app](https://voicerunners.vercel.app)
            **🟥 Itch.io:** [mardev1.itch.io/voice-runner](https://mardev1.itch.io/voice-runner)

            ### ✅ Changes
            ${{ github.event.head_commit.message || '—' }}

            ### 📥 Downloads

            | Platform | File |
            |----------|------|
            | 📦 Itch.io | ZIP game (lihat Assets bawah) |

            > Build desktop (.exe/.dmg/.AppImage) di-upload otomatis oleh workflow
            > **Build Voice Runner Desktop (Electron)** ke release yang sama.

            ---
            *Auto-generated by GitHub Actions*
          draft: false
          prerelease: false
          update_existing: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
